name: Build QSVEncC 8.31 + VPP sync fix (unofficial)

# Unofficial build of rigaya/QSVEnc 8.31 with one patch (rigaya/QSVEnc#316):
# wait for the VPP output syncpoint before EncodeFrameAsync (workaround for #308).
# Same build steps and the same public build images as upstream build_packages.yml.

on:
  push:
    branches:
      - vppsync-8.31
  workflow_dispatch:

permissions:
  contents: read

env:
  PKG_SUFFIX: vppsync1
  RELEASE_TAG: 8.31-vppsync1
  BASE_IMAGE_REPO: ghcr.io/rigaya/qsvenc-build
  FFMPEG_PREFIX: /opt/build_scripts/ffmpeg_dll/build_dll/x64/build
  VMAF_PREFIX: /opt/build_scripts/ffmpeg_dll/x64/build

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerimg: ubuntu2004
            pkgtype: deb
          - dockerimg: fedora41
            pkgtype: rpm
    name: Build ${{ matrix.dockerimg }} ${{ matrix.pkgtype }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Show patch
        run: git log --oneline -5 && git diff --stat 8.31 HEAD -- . ':!.github' || true

      - name: Mark package version (CI-only edit)
        run: |
          set -eu
          VER=$(./scripts/get-version.sh)
          sed -i "s/^PACKAGE_VERSION=.*/PACKAGE_VERSION=${VER}+${PKG_SUFFIX}/" build_deb.sh
          sed -i "s/^Release:.*/Release:    1.${PKG_SUFFIX}/
          grep -n "^PACKAGE_VERSION=" build_deb.sh
          grep -n "^Release:" build_pkg/template.spec

      - name: Pull base image
        run: docker pull ${BASE_IMAGE_REPO}:${{ matrix.dockerimg }}

      - name: Build
        run: |
          set -eu                                                                                                                             mkdir -p output
          docker run -dit --rm -v ${{ github.workspace }}:/work -v ${{ github.workspace }}/output:/output \                                     -u "$(id -u):$(id -g)" --workdir /work --name bu{ matrix.dockerimg }}
          docker exec build_pkg bash -lc '                                                                                                      VMAFPKG="${{ env.VMAF_PREFIX }}/lib/pkgconfig"
            FFPKG="${{ env.FFMPEG_PREFIX }}/lib/pkgconfig:${{ env.FFMPEG_PREFIX }}/lib/x86_64-linux-gnu/pkgconfig"                              export PKG_CONFIG_PATH="${VMAFPKG}:${FFPKG}${PKGATH}}"
            meson setup ./build . --buildtype=release -Db_lto=true -Dlibass_static=true -Denable_vmaf=enabled -Dlibvmaf_static=true -Denable_libvship=disabled -Dcpp_args="['\''-I/work/AviSynth'-I/work/vapoursynth/include'\'']"
          '
          docker exec build_pkg bash -lc "meson compile -C .
          docker exec build_pkg bash -lc 'ldd ./build/qsvencc'
          docker exec build_pkg ./build/qsvencc --version
          docker exec build_pkg ./check_options.py -exe ./build/qsvencc
          docker exec build_pkg ./build/qsvencc --check-cmd-
          docker exec build_pkg cp ./build/qsvencc ./qsvencc
          docker exec build_pkg ./build_${{ matrix.pkgtype }
          docker exec build_pkg bash -lc "cp -v ./*.${{ matrix.pkgtype }} /output/"
          docker stop build_pkg || true
          cd output
          for f in *.${{ matrix.pkgtype }}; do mv -v "$f" "$rix.pkgtype }}\$/_${{ matrix.dockerimg }}.${{ matrix.pkgtype}}/")"; done
          ls -l

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qsvencc_${{ matrix.dockerimg }}_${{ matrix.pkgtype }}
          path: output/*.${{ matrix.pkgtype }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * | tee SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          cat > notes.md <<'EOF'
          **Unofficial build — not from rigaya.** QSVEncC 8. plus one patch:
          wait for the VPP output syncpoint before `EncodeFrameAsync` (rigaya/QSVEnc#316).

          It works around a silent single-frame corruption when several QSVEncC sessions share one Intel GPU
          (AV1 10-bit, `--avhw`, P010 VPP stage, B-pyramid; r tests on an Arc A380
          (Linux, iHD 26.2.2): 3 concurrent sessions, 0 corrupt frames in 60 iterations with the patch vs. about
          one third of hot-scene encodes without it; single- stock 8.31; no measurable
          throughput cost.

          Built by GitHub Actions with rigaya's public build images (same steps as upstream `build_packages.yml`):
          - `*_ubuntu2004.deb` — Ubuntu 20.04 / 22.04 / 24.0 Needs Intel media
            driver and oneVPL GPU runtime (`intel-media-va-driver-non-free`, `libmfx-gen1.2` or `libmfxgen1`).
          - `*_fedora41.rpm` — Fedora 41+.

          The package version is `8.31+vppsync1` (deb) / `8.fficial 8.32 replaces it.
          Verify downloads with `SHA256SUMS`.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobbe
          else
            gh release create "$RELEASE_TAG" dist/* --target
              --title "QSVEncC 8.31 + VPP sync fix (unofficial, $RELEASE_TAG)" --notes-file notes.md
          fi
